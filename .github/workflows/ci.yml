name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ["1.25.x", stable]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with: {go-version: "${{ matrix.go }}", cache: true}
      - run: go test ./...
      - run: go build ./...
  hardening:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with: {go-version: 1.25.x, cache: true}
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: make check
  release-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - uses: actions/setup-go@v7
        with: {go-version: 1.25.x}
      - uses: anchore/sbom-action/download-syft@v0
      - uses: goreleaser/goreleaser-action@v7
        with: {distribution: goreleaser, version: latest, args: "release --snapshot --clean"}
