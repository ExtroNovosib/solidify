name: CI
on:
  push:
    branches: [main]
  pull_request: {}
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ["1.25.x", stable]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: {go-version: "${{ matrix.go }}", cache: true}
      # Install the pinned release binary once instead of compiling
      # golangci-lint from source in every matrix job.
      - uses: golangci/golangci-lint-action@v8
        with: {version: v2.12.2, install-only: true}
      - run: make check-fast GOLANGCI_LINT=golangci-lint
  hardening:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: {go-version: 1.25.x, cache: true}
      - uses: anchore/sbom-action/download-syft@v0
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
      - run: make check
  sarif:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: {go-version: 1.25.x, cache: true}
      - run: make build
      - run: ./bin/solidlint -format=sarif -fail=false ./internal/analyzer/... > solidlint.sarif
      - uses: github/codeql-action/upload-sarif@v4
        with: {sarif_file: solidlint.sarif, category: solidlint}
  release-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - uses: actions/setup-go@v7
        with: {go-version: 1.25.x}
      - uses: anchore/sbom-action/download-syft@v0
      - uses: goreleaser/goreleaser-action@v7
        with: {distribution: goreleaser, version: v2.17.1, args: "release --snapshot --clean"}
